name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutorbot
          POSTGRES_PASSWORD: tutorbot
          POSTGRES_DB: tutorbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://tutorbot:tutorbot@localhost:5432/tutorbot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      WEBHOOK_SECRET: ci-webhook-secret-at-least-32-characters
      RATE_LIMIT_LOGIN_PER_MINUTE: "5"
      RATE_LIMIT_WEBHOOK_PER_MINUTE: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
